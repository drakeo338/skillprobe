name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/ruff-action@v3
        with:
          args: check
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  dogfood:
    # The tool must survive being pointed at a real skills tree, not only at
    # fixtures. Its own repo has none, so this asserts the CLI runs clean on an
    # empty tree and reports correctly on a deliberately broken one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Clean tree exits zero
        run: |
          mkdir -p /tmp/skills/good
          printf -- '---\nname: good\ndescription: Use when the user converts a `.csv` file to a chart.\n---\nBody.\n' > /tmp/skills/good/SKILL.md
          skillprobe /tmp/skills
      - name: Broken tree exits non-zero
        run: |
          mkdir -p /tmp/bad/broken
          printf -- '---\nname: broken\n---\nNo description.\n' > /tmp/bad/broken/SKILL.md
          if skillprobe /tmp/bad; then echo "expected failure"; exit 1; fi
