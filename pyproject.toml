[project]
name = "skillprobe"
version = "0.1.0"
description = "Lint agent skills: will they trigger, what do they cost you every turn, and do they collide?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agent-skills", "claude-code", "linter", "developer-tools", "llm"]
dependencies = [
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
exact = ["tiktoken>=0.5"]

[project.scripts]
skillprobe = "skillprobe.cli:main"

[project.urls]
Repository = "https://github.com/paranoyouz-collab/skillprobe"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillprobe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "SIM", "RUF"]
